<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Jam Muka</title>
<style>
:root{
  --bg:#0b0f14; --panel:#141a22; --fg:#e8eef5; --mute:#8a98a8;
  --ok:#3ddc97; --idle:#f2b84b; --line:#232c37; --err:#ff6b6b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; gap:16px;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  max-width:560px; margin:0 auto;
}
.clock{text-align:center; padding-top:8px}
#clock{
  font-size:clamp(3rem,18vw,5.5rem); font-weight:600; letter-spacing:.02em;
  font-variant-numeric:tabular-nums; line-height:1;
}
#date{color:var(--mute); margin-top:8px; font-size:.95rem}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px}
.status{display:flex; align-items:center; gap:10px; font-size:.95rem; color:var(--mute)}
.dot{width:12px; height:12px; border-radius:50%; background:var(--mute); flex:none}
.status.on .dot{background:var(--ok); box-shadow:0 0 0 4px rgba(61,220,151,.18)}
.status.wait .dot{background:var(--idle)}
.status.on{color:var(--fg)}
.label{font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--mute)}
#timer{
  font-size:clamp(2.6rem,15vw,4.2rem); font-weight:600;
  font-variant-numeric:tabular-nums; margin-top:6px; line-height:1.05;
}
#timer.on{color:var(--ok)}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.stats .panel{padding:14px 16px}
.stats b{display:block; font-size:1.5rem; font-variant-numeric:tabular-nums; margin-top:4px; font-weight:600}
.controls{display:flex; gap:10px; flex-wrap:wrap}
button{
  font:inherit; font-weight:600; border:0; border-radius:12px; padding:14px 18px;
  background:var(--ok); color:#06210f; cursor:pointer; flex:1 1 140px; min-height:48px;
}
button.sec{background:var(--panel); color:var(--fg); border:1px solid var(--line)}
button:focus-visible{outline:2px solid var(--fg); outline-offset:2px}
button[disabled]{opacity:.5}
#msg{font-size:.9rem; color:var(--mute); min-height:1.2em}
#msg.err{color:var(--err)}
.preview{display:none; justify-content:center}
.preview.show{display:flex}
video{width:100%; max-width:220px; border-radius:12px; background:#000; transform:scaleX(-1); border:1px solid var(--line)}
.note{font-size:.8rem; color:var(--mute); line-height:1.5}
</style>
</head>
<body>
<div class="clock">
  <div id="clock">00:00:00</div>
  <div id="date"></div>
</div>

<div class="panel">
  <div id="status" class="status"><span class="dot"></span><span id="statusText">Kamera belum dimulakan</span></div>
  <div class="label" style="margin-top:16px">Masa di depan kamera (sesi semasa)</div>
  <div id="timer">00:00:00</div>
</div>

<div class="stats">
  <div class="panel"><div class="label">Sesi hari ini</div><b id="count">0</b></div>
  <div class="panel"><div class="label">Jumlah hari ini</div><b id="total">00:00:00</b></div>
</div>

<div class="controls">
  <button id="startBtn">Mulakan kamera</button>
  <button id="previewBtn" class="sec" disabled>Tunjuk pratonton</button>
  <button id="resetBtn" class="sec">Set semula hari ini</button>
</div>

<div id="msg"></div>
<div id="previewBox" class="preview"><video id="video" playsinline muted></video></div>

<p class="note">Pengesanan muka berlaku dalam telefon sahaja. Video tidak disimpan dan tidak dihantar ke mana-mana. Kekalkan skrin hidup dan tab ini terbuka supaya kamera terus berjalan.</p>

<script type="module">
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmt = ms => { const s = Math.floor(ms / 1000); return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60); };
const GRACE_MS = 1500;       // berapa lama muka hilang sebelum sesi dianggap tamat
const CHECK_MS = 120;        // jarak antara setiap pengesanan

// ---- Jam digital
function tickClock() {
  const d = new Date();
  $("clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  $("date").textContent = d.toLocaleDateString("ms-MY", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

// ---- Simpanan harian
const dayKey = () => "jamMuka:" + new Date().toISOString().slice(0, 10);
let count = 0, totalMs = 0;
function loadDay() {
  try { const v = JSON.parse(localStorage.getItem(dayKey()) || "null"); if (v) { count = v.count || 0; totalMs = v.totalMs || 0; } } catch (e) {}
}
function saveDay() { try { localStorage.setItem(dayKey(), JSON.stringify({ count, totalMs })); } catch (e) {} }

// ---- Keadaan sesi
let present = false, sessionStart = 0, lastSeen = 0;
function setStatus(cls, text) { $("status").className = "status " + cls; $("statusText").textContent = text; }
function setMsg(t, err) { $("msg").textContent = t || ""; $("msg").className = err ? "err" : ""; }

function onSeen(now) {
  lastSeen = now;
  if (!present) { present = true; sessionStart = now; setStatus("on", "Ada orang di depan kamera"); }
}
function onLostCheck(now) {
  if (present && now - lastSeen > GRACE_MS) {
    const dur = lastSeen - sessionStart;
    present = false;
    if (dur > 500) { count++; totalMs += dur; saveDay(); }
    setStatus("wait", "Tiada orang dikesan");
  }
}
function render() {
  const now = Date.now();
  const cur = present ? now - sessionStart : 0;
  $("timer").textContent = fmt(cur);
  $("timer").className = present ? "on" : "";
  $("count").textContent = count + (present ? 1 : 0);
  $("total").textContent = fmt(totalMs + cur);
}

// ---- Kamera dan pengesan muka
const video = $("video");
let stream = null, detector = null, nativeDetector = null, running = false, wakeLock = null;

async function loadDetector() {
  try {
    const mp = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
    const fileset = await mp.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = (delegate) => ({
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite", delegate },
      runningMode: "VIDEO", minDetectionConfidence: 0.6
    });
    try { detector = await mp.FaceDetector.createFromOptions(fileset, opts("GPU")); }
    catch (e) { detector = await mp.FaceDetector.createFromOptions(fileset, opts("CPU")); }
    return true;
  } catch (e) {
    if ("FaceDetector" in window) {
      try { nativeDetector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 }); return true; } catch (e2) {}
    }
    return false;
  }
}

async function keepAwake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (running && document.visibilityState === "visible") keepAwake(); });

async function loop() {
  if (!running) return;
  const now = Date.now();
  try {
    if (video.readyState >= 2) {
      let seen = false;
      if (detector) seen = detector.detectForVideo(video, performance.now()).detections.length > 0;
      else if (nativeDetector) seen = (await nativeDetector.detect(video)).length > 0;
      if (seen) onSeen(now);
    }
  } catch (e) {}
  onLostCheck(now);
  setTimeout(loop, CHECK_MS);
}

async function start() {
  $("startBtn").disabled = true;
  setMsg("Meminta akses kamera...");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 360 } }, audio: false });
  } catch (e) {
    setMsg("Kamera tidak dapat dibuka. Benarkan akses kamera dalam tetapan pelayar dan pastikan halaman dibuka melalui https.", true);
    $("startBtn").disabled = false;
    return;
  }
  video.srcObject = stream;
  await video.play().catch(() => {});
  setMsg("Memuatkan pengesan muka...");
  const ok = await loadDetector();
  if (!ok) {
    setMsg("Pengesan muka gagal dimuatkan. Semak sambungan internet dan cuba lagi.", true);
    stream.getTracks().forEach(t => t.stop()); stream = null;
    $("startBtn").disabled = false;
    return;
  }
  running = true;
  keepAwake();
  setStatus("wait", "Menunggu orang di depan kamera");
  setMsg("");
  $("startBtn").textContent = "Henti kamera";
  $("startBtn").disabled = false;
  $("previewBtn").disabled = false;
  loop();
}

function stop() {
  running = false;
  if (present) { const dur = lastSeen - sessionStart; present = false; if (dur > 500) { count++; totalMs += dur; saveDay(); } }
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null;
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  setStatus("", "Kamera dihentikan");
  $("startBtn").textContent = "Mulakan kamera";
  $("previewBtn").disabled = true;
  $("previewBox").classList.remove("show");
  $("previewBtn").textContent = "Tunjuk pratonton";
}

$("startBtn").addEventListener("click", () => running ? stop() : start());
$("previewBtn").addEventListener("click", () => {
  const show = !$("previewBox").classList.contains("show");
  $("previewBox").classList.toggle("show", show);
  $("previewBtn").textContent = show ? "Sembunyi pratonton" : "Tunjuk pratonton";
});
$("resetBtn").addEventListener("click", () => {
  count = 0; totalMs = 0; present = false; saveDay(); render();
});

loadDay(); tickClock(); render();
setInterval(tickClock, 1000);
setInterval(render, 200);
</script>
</body>
</html>
